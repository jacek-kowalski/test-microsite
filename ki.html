<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kalshi API POC</title>
<style>
    html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #stage { position:absolute; width:1920px; height:1080px; transform-origin:0 0;
             background:#111; color:#eee; font-family:monospace; box-sizing:border-box; padding:40px 60px; }
    #status { font-size:26px; margin-bottom:20px; color:#8f8; }
    #status.err { color:#f66; }
    #out { font-size:20px; line-height:1.35; white-space:pre-wrap; word-break:break-all;
           margin:0; height:940px; overflow:hidden; }
</style>
</head>
<body>
<div id="stage">
    <div id="status">Loading...</div>
    <pre id="out"></pre>
</div>
<script>
var STAGE_W = 1920, STAGE_H = 1080;
var stage = document.getElementById('stage');
function scaleStage() {
    var scale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
    stage.style.transform = 'scale(' + scale + ')';
    stage.style.left = ((window.innerWidth - STAGE_W * scale) / 2) + 'px';
    stage.style.top = ((window.innerHeight - STAGE_H * scale) / 2) + 'px';
}
scaleStage();
window.addEventListener('resize', scaleStage);

// Default = Kalshi DEMO env: it returns CORS headers for any Origin (incl. null/file://).
// Production (external-api.kalshi.com) 403s any browser Origin except kalshi.com,
// so it needs a CORS proxy - pass it via ?api=<url> override.
// WebSocket API needs signed API-key headers (401 otherwise) - not usable from a browser page.
function getParam(name) {
    var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
    return m ? decodeURIComponent(m[1]) : null;
}
var API_URL = getParam('api') ||
    'https://external-api.demo.kalshi.co/trade-api/v2/markets/KXNFLGAME-26NOV19INDHOU-HOU';
var POLL_MS = 5000;

var statusEl = document.getElementById('status');
var outEl = document.getElementById('out');
var count = 0;

function setStatus(text, isErr) {
    statusEl.textContent = text;
    statusEl.className = isErr ? 'err' : '';
}

function poll() {
    var xhr = new XMLHttpRequest();
    var url = API_URL + (API_URL.indexOf('?') < 0 ? '?' : '&') + '_t=' + Date.now(); // cache-buster
    xhr.open('GET', url, true);
    xhr.timeout = 4500;
    xhr.onload = function () {
        var time = new Date().toLocaleTimeString();
        if (xhr.status !== 200) {
            setStatus('[' + time + '] HTTP ' + xhr.status + ' from ' + API_URL, true);
            return;
        }
        try {
            var data = JSON.parse(xhr.responseText);
            count++;
            outEl.textContent = JSON.stringify(data, null, 2);
            setStatus('[' + time + '] OK - update #' + count + ' - polling every ' + (POLL_MS / 1000) + 's');
        } catch (e) {
            setStatus('[' + time + '] JSON parse error: ' + e.message, true);
        }
    };
    xhr.onerror = function () {
        setStatus('[' + new Date().toLocaleTimeString() + '] Network/CORS error (status ' + xhr.status + ') - ' + API_URL, true);
    };
    xhr.ontimeout = function () {
        setStatus('[' + new Date().toLocaleTimeString() + '] Request timed out', true);
    };
    xhr.send();
}

poll();
setInterval(poll, POLL_MS);

// Samsung ad-player contract + desktop testing
var KeyCodes = {
    RETURN: [10009, 88],
    EXIT:   [10182, 45]
};
function onKeyDown(e) {
    var k = e.keyCode;
    if (KeyCodes.RETURN.indexOf(k) >= 0 || KeyCodes.EXIT.indexOf(k) >= 0) {
        if (window.$SAMSUNG && window.$SAMSUNG.closeMicrosite) window.$SAMSUNG.closeMicrosite();
    }
}
document.addEventListener('keydown', onKeyDown);
window.$SAMSUNG = window.$SAMSUNG || {};
window.$SAMSUNG.onKeyDown = onKeyDown;
window.$SAMSUNG.onLoad = function () {};
</script>
</body>
</html>
